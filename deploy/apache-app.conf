ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>
    # Match URL paths, not just filenames: vendor files must never be public.
    <LocationMatch "^/(?!$|(?:index\.php|proxy\.php|map\.js|map\.css|favicon\.ico)$|icons/(?:node_2_1\.png|hkfree-logo-druzstvo\.png)$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
