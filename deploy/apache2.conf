# Host Apache: replace the hostname, certificate paths and (if changed) port.
<VirtualHost *:443>
    ServerName mapa.example.cz
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/hkfree-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/hkfree.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Host "mapa.example.cz"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:8088/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8088/
</VirtualHost>
