services:
  web:
    image: ${WEB_IMAGE:?Nastavte WEB_IMAGE v souboru .env}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    environment:
      USERDB_URL: ${USERDB_URL:?Nastavte USERDB_URL v souboru .env}
      USERDB_USER: ${USERDB_USER:?Nastavte USERDB_USER v souboru .env}
      USERDB_API_KEY: ${USERDB_API_KEY:?Nastavte USERDB_API_KEY v souboru .env}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:?Nastavte MAPBOX_TOKEN v souboru .env}
